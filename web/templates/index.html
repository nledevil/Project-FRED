<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>InMoov Control</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --line:#252c38; --fg:#e6edf3;
          --mut:#8b98a9; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--fg); padding:16px; max-width:820px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; letter-spacing:.04em; }
  .badge.mock { background:#3a2a00; color:var(--warn); }
  .badge.live { background:#04310f; color:var(--ok); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  button { font:inherit; font-weight:600; color:var(--fg); background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:10px 16px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--mut); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .name { font-weight:700; font-size:17px; }
  .ch { color:var(--mut); font-size:13px; font-weight:500; }
  .desc { color:var(--mut); font-size:13px; margin:2px 0 10px; }
  .val { font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; }
  input[type=range] { width:100%; height:38px; accent-color:var(--accent); }
  .lim { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .lim.hidden { display:none; }
  .lim button { padding:8px 12px; font-size:13px; }
  .lim .info { color:var(--mut); font-size:12px; align-self:center; margin-left:auto;
               font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#04310f; color:var(--ok); border:1px solid #0a5; padding:10px 18px;
           border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; font-weight:600; }
  #toast.show { opacity:1; }
  .stage { display:flex; justify-content:center; margin:6px 0 22px;
           filter:drop-shadow(0 10px 22px #0009); }
  .stage svg { width:min(64vw,250px); height:auto; }
  #headGroup { transform-box:fill-box; transform-origin:50% 46%; transition:transform .12s ease; }
  .skull, .nose { fill:url(#skull); stroke:#b3bcc7; stroke-width:1; }
  .seam { fill:none; stroke:#95a0ac; stroke-width:.8; opacity:.55;
          stroke-linecap:round; stroke-linejoin:round; }
  .socket { fill:#060810; }
  .iris { transition:transform .07s linear; }
  .irisball { fill:url(#iris); }
  .iring { fill:none; stroke:#cfefff; stroke-width:1.6; opacity:.9; }
  .led { fill:#dff2ff; opacity:.9; }
  .pupil { fill:#03060c; }
  .glint { fill:#f2fbff; opacity:.9; }
  .rim { fill:none; stroke:#b9c1cc; stroke-width:1.6; }
  .lash { fill:none; stroke:#77828f; stroke-width:2; opacity:.7; stroke-linecap:round; }
  .nostril { fill:#20272f; opacity:.85; }
  .lip { fill:none; stroke:#8f99a6; stroke-width:1.5; opacity:.7; stroke-linecap:round; }
  #lowerlip { transition:transform .1s ease; }
  .rod { stroke:#0f1319; stroke-width:9; stroke-linecap:round; fill:none; }
  .neckcore { fill:#14181f; stroke:#242c37; stroke-width:1; }
  .rib { stroke:#2a323d; stroke-width:1; fill:none; }
  .screw { fill:#7c8794; opacity:.55; }
  @media (prefers-reduced-motion: reduce) {
    #headGroup, .iris, #lowerlip { transition:none; }
  }
</style>
</head>
<body>
<header>
  <h1>InMoov Control</h1>
  <span id="mode" class="badge">…</span>
</header>

<div class="bar">
  <button onclick="rest()">↺ Rest all</button>
  <button onclick="relax()">◌ Relax all</button>
  <button id="saveBtn" class="primary hidden" onclick="save()">💾 Save config</button>
  <label class="toggle"><input type="checkbox" id="calib" onchange="setCalib()"> Calibration mode</label>
</div>

<div class="stage">
  <svg id="head" viewBox="0 0 240 300" aria-label="InMoov head preview">
    <defs>
      <linearGradient id="skull" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbfcfe"/>
        <stop offset="0.55" stop-color="#e2e7ee"/>
        <stop offset="1" stop-color="#c1c9d4"/>
      </linearGradient>
      <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#7ec2f5"/>
        <stop offset="0.55" stop-color="#2f7fd8"/>
        <stop offset="1" stop-color="#0f4f86"/>
      </radialGradient>
      <linearGradient id="cav" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04060a"/>
        <stop offset="1" stop-color="#141f2b"/>
      </linearGradient>
      <clipPath id="clipL"><path d="M62,122 Q87,110 112,122 Q87,134 62,122 Z"/></clipPath>
      <clipPath id="clipR"><path d="M128,122 Q153,110 178,122 Q153,134 128,122 Z"/></clipPath>
    </defs>

    <!-- mechanical neck (static pivot behind the head) -->
    <path class="rod" d="M96,300 L110,252"/>
    <path class="rod" d="M144,300 L130,252"/>
    <rect class="neckcore" x="104" y="250" width="32" height="50" rx="8"/>
    <path class="rib" d="M105,262 H135 M105,272 H135 M105,282 H135"/>

    <g id="headGroup">
      <!-- skull -->
      <path class="skull" d="M120,32 C172,32 198,66 196,118
        C195,154 188,184 170,208 C160,228 150,252 120,260
        C90,252 80,228 70,208 C52,184 45,154 44,118 C42,66 68,32 120,32 Z"/>

      <!-- skull-cap seam + faceted forehead (seams radiate from a point) -->
      <path class="seam" d="M50,104 Q120,98 190,104"/>
      <path class="seam" d="M120,42 L120,94 M74,56 L120,94 M166,56 L120,94 M120,94 L94,104 M120,94 L148,104"/>
      <!-- jaw / cheek panel seams -->
      <path class="seam" d="M62,172 Q74,214 108,230 M178,172 Q166,214 132,230"/>

      <!-- eyes: eyeball clipped to the almond opening; rim = the faceplate cut -->
      <g clip-path="url(#clipL)">
        <path class="socket" d="M62,122 Q87,110 112,122 Q87,134 62,122 Z"/>
        <g class="iris" id="irisL">
          <circle class="irisball" cx="87" cy="122" r="9"/>
          <circle class="iring"    cx="87" cy="122" r="8.2"/>
          <circle class="led" cx="93.6" cy="125.8" r="0.9"/><circle class="led" cx="87" cy="129.6" r="0.9"/>
          <circle class="led" cx="80.4" cy="125.8" r="0.9"/><circle class="led" cx="80.4" cy="118.2" r="0.9"/>
          <circle class="led" cx="87" cy="114.4" r="0.9"/><circle class="led" cx="93.6" cy="118.2" r="0.9"/>
          <circle class="pupil"    cx="87" cy="122" r="5.5"/>
          <circle class="glint"    cx="84" cy="119" r="1.6"/>
        </g>
      </g>
      <path class="rim"  d="M62,122 Q87,110 112,122 Q87,134 62,122 Z"/>
      <path class="lash" d="M62,122 Q87,110 112,122"/>
      <g clip-path="url(#clipR)">
        <path class="socket" d="M128,122 Q153,110 178,122 Q153,134 128,122 Z"/>
        <g class="iris" id="irisR">
          <circle class="irisball" cx="153" cy="122" r="9"/>
          <circle class="iring"    cx="153" cy="122" r="8.2"/>
          <circle class="led" cx="159.6" cy="125.8" r="0.9"/><circle class="led" cx="153" cy="129.6" r="0.9"/>
          <circle class="led" cx="146.4" cy="125.8" r="0.9"/><circle class="led" cx="146.4" cy="118.2" r="0.9"/>
          <circle class="led" cx="153" cy="114.4" r="0.9"/><circle class="led" cx="159.6" cy="118.2" r="0.9"/>
          <circle class="pupil"    cx="153" cy="122" r="5.5"/>
          <circle class="glint"    cx="150" cy="119" r="1.6"/>
        </g>
      </g>
      <path class="rim"  d="M128,122 Q153,110 178,122 Q153,134 128,122 Z"/>
      <path class="lash" d="M128,122 Q153,110 178,122"/>

      <!-- nose -->
      <path class="nose" d="M120,122 C116,142 111,158 106,169
        C101,177 110,183 120,183 C130,183 139,177 134,169
        C129,158 124,142 120,122 Z"/>
      <ellipse class="nostril" cx="111" cy="178" rx="3.1" ry="1.7"/>
      <ellipse class="nostril" cx="129" cy="178" rx="3.1" ry="1.7"/>

      <!-- mouth: cavity grows + lower lip drops with the jaw servo (slight smile) -->
      <ellipse id="mouthCav" fill="url(#cav)" cx="120" cy="198" rx="24" ry="2"/>
      <path class="lip" d="M101,196 Q120,199 139,196"/>
      <path class="lip" id="lowerlip" d="M104,200 Q120,207 136,200"/>

      <!-- screw-hole detail dots -->
      <circle class="screw" cx="120" cy="58" r="1.6"/>
      <circle class="screw" cx="88"  cy="104" r="1.5"/>
      <circle class="screw" cx="152" cy="104" r="1.5"/>
      <circle class="screw" cx="82"  cy="152" r="1.5"/>
      <circle class="screw" cx="158" cy="152" r="1.5"/>
    </g>
  </svg>
</div>

<div id="servos"></div>
<div id="toast"></div>

<script>
let STATE = null;
let CALIB = false;
const throttle = {};   // per-servo trailing throttle timers

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET' };
  if (body) { opt.headers = {'Content-Type':'application/json'}; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function load() {
  STATE = await api('/api/state');
  const m = document.getElementById('mode');
  m.textContent = STATE.mock ? 'MOCK' : 'LIVE';
  m.className = 'badge ' + (STATE.mock ? 'mock' : 'live');
  render();
}

function render() {
  const wrap = document.getElementById('servos');
  wrap.innerHTML = '';
  for (const [name, s] of Object.entries(STATE.servos)) {
    const lo = CALIB ? 0 : s.min_angle;
    const hi = CALIB ? s.actuation_range : s.max_angle;
    const cur = s.current ?? s.rest_angle;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="row">
        <span class="name">${name} <span class="ch">ch ${s.channel}</span></span>
        <span class="val" id="v-${name}">${(+cur).toFixed(0)}°</span>
      </div>
      <div class="desc">${s.description || ''}</div>
      <input type="range" id="r-${name}" min="${lo}" max="${hi}" step="1" value="${cur}"
             oninput="move('${name}', this.value)">
      <div class="lim ${CALIB ? '' : 'hidden'}">
        <button onclick="record('${name}','min')">Set min</button>
        <button onclick="record('${name}','rest')">Set rest</button>
        <button onclick="record('${name}','max')">Set max</button>
        <span class="info" id="lim-${name}">min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}</span>
      </div>`;
    wrap.appendChild(el);
  }
  updateHead();
}

// ---- live head preview -------------------------------------------------
function _val(name) {
  const s = STATE.servos[name];
  if (!s) return null;
  const el = document.getElementById('r-' + name);
  return { v: el ? +el.value : (s.current ?? s.rest_angle), s };
}
function _centered(name) {           // -1..+1 around the servo's mid-travel
  const r = _val(name);
  if (!r) return 0;
  const mid = (r.s.min_angle + r.s.max_angle) / 2;
  const half = ((r.s.max_angle - r.s.min_angle) / 2) || 1;
  return Math.max(-1, Math.min(1, (r.v - mid) / half));
}
function updateHead() {
  if (!STATE) return;
  const g = document.getElementById('headGroup');
  if (g && STATE.servos.neck)
    g.style.transform = `perspective(640px) rotateY(${_centered('neck') * 32}deg)`;
  const ex = STATE.servos.eye_x ? _centered('eye_x') * 10 : 0;   // right = +
  const ey = STATE.servos.eye_y ? -_centered('eye_y') * 3 : 0;   // up = -
  for (const id of ['irisL', 'irisR']) {
    const p = document.getElementById(id);
    if (p) p.style.transform = `translate(${ex}px, ${ey}px)`;
  }
  const j = _val('jaw');
  const cav = document.getElementById('mouthCav'), low = document.getElementById('lowerlip');
  if (j && cav) {
    const f = Math.max(0, Math.min(1,
      (j.v - j.s.min_angle) / ((j.s.max_angle - j.s.min_angle) || 1)));
    const ry = 2 + f * 12;
    cav.setAttribute('ry', ry);
    cav.setAttribute('cy', 196 + ry);          // keep the upper lip fixed at ~196
    if (low) low.style.transform = `translateY(${f * 14}px)`;
  }
}

function move(name, angle) {
  document.getElementById('v-' + name).textContent = (+angle).toFixed(0) + '°';
  updateHead();
  // trailing throttle: at most ~1 request / 60ms per servo, always send the last
  const t = throttle[name] || (throttle[name] = {});
  const now = performance.now();
  t.pending = angle;
  const send = () => { t.last = performance.now(); t.timer = null;
                       api('/api/move', {name, angle:+t.pending, raw:CALIB}); };
  if (!t.last || now - t.last > 60) send();
  else if (!t.timer) t.timer = setTimeout(send, 60);
}

async function record(name, field) {
  const angle = +document.getElementById('r-' + name).value;
  STATE = await api('/api/record', {name, field, angle});
  const s = STATE.servos[name];
  document.getElementById('lim-' + name).textContent =
    `min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}`;
  toast(`${name} ${field} = ${angle}°`);
}

async function save() { const r = await api('/api/save', {}); toast('Saved config'); }

async function rest() { STATE = await api('/api/rest'); render(); }
async function relax() { await api('/api/relax', {}); toast('Relaxed'); }

function setCalib() {
  CALIB = document.getElementById('calib').checked;
  document.getElementById('saveBtn').classList.toggle('hidden', !CALIB);
  render();
}

load();
</script>
</body>
</html>
