<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>InMoov Control</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --line:#252c38; --fg:#e6edf3;
          --mut:#8b98a9; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--fg); padding:16px; max-width:820px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; letter-spacing:.04em; }
  .badge.mock { background:#3a2a00; color:var(--warn); }
  .badge.live { background:#04310f; color:var(--ok); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  button { font:inherit; font-weight:600; color:var(--fg); background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:10px 16px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--mut); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .name { font-weight:700; font-size:17px; }
  .ch { color:var(--mut); font-size:13px; font-weight:500; }
  .desc { color:var(--mut); font-size:13px; margin:2px 0 10px; }
  .val { font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; }
  input[type=range] { width:100%; height:38px; accent-color:var(--accent); }
  .lim { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .lim.hidden { display:none; }
  .lim button { padding:8px 12px; font-size:13px; }
  .lim .info { color:var(--mut); font-size:12px; align-self:center; margin-left:auto;
               font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#04310f; color:var(--ok); border:1px solid #0a5; padding:10px 18px;
           border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; font-weight:600; }
  #toast.show { opacity:1; }
  .stage { display:flex; justify-content:center; margin:6px 0 22px;
           filter:drop-shadow(0 10px 22px #0009); }
  .stage svg { width:min(64vw,250px); height:auto; }
  #headGroup { transform-box:fill-box; transform-origin:50% 46%; transition:transform .12s ease; }
  .skull, .nose { fill:url(#skull); stroke:#aab3bf; stroke-width:1.1; }
  .seam { fill:none; stroke:#8f99a6; stroke-width:.8; opacity:.5;
          stroke-linecap:round; stroke-linejoin:round; }
  .sclera { fill:#eef2f6; }
  .iris { transition:transform .07s linear; }
  .irisball { fill:url(#iris); }
  .pupil { fill:#0a1420; }
  .glint { fill:#eaf6ff; }
  .lid { fill:url(#skull); stroke:#aab3bf; stroke-width:.8;
         transform:translateY(-17px); transition:transform .09s ease; }
  #head.blinking .lid { transform:translateY(0); }
  .brow { fill:#b9c2cd; opacity:.4; }
  .nostril { fill:#57626f; opacity:.55; }
  .lip { fill:none; stroke:#8f99a6; stroke-width:1.4; opacity:.65; stroke-linecap:round; }
  #lowerlip { transition:transform .1s ease; }
  .ear { fill:#1a1f27; stroke:#2b3543; stroke-width:1.3; }
  .earline { fill:none; stroke:#39434f; stroke-width:1.2; }
  .neckseg { fill:#20262f; stroke:#2b3543; stroke-width:1.1; }
  .screw { fill:#7c8794; opacity:.5; }
  @media (prefers-reduced-motion: reduce) {
    #headGroup, .iris, .lid, #lowerlip { transition:none; }
  }
</style>
</head>
<body>
<header>
  <h1>InMoov Control</h1>
  <span id="mode" class="badge">…</span>
</header>

<div class="bar">
  <button onclick="rest()">↺ Rest all</button>
  <button onclick="relax()">◌ Relax all</button>
  <button id="saveBtn" class="primary hidden" onclick="save()">💾 Save config</button>
  <label class="toggle"><input type="checkbox" id="calib" onchange="setCalib()"> Calibration mode</label>
</div>

<div class="stage">
  <svg id="head" viewBox="0 0 240 300" aria-label="InMoov head preview">
    <defs>
      <linearGradient id="skull" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbfcfe"/>
        <stop offset="0.55" stop-color="#e2e7ee"/>
        <stop offset="1" stop-color="#c1c9d4"/>
      </linearGradient>
      <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#a6d8ff"/>
        <stop offset="0.45" stop-color="#3f8fd0"/>
        <stop offset="1" stop-color="#1b4f7d"/>
      </radialGradient>
      <linearGradient id="cav" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04060a"/>
        <stop offset="1" stop-color="#12202f"/>
      </linearGradient>
      <clipPath id="clipL"><ellipse cx="96" cy="120" rx="17" ry="11"/></clipPath>
      <clipPath id="clipR"><ellipse cx="144" cy="120" rx="17" ry="11"/></clipPath>
    </defs>

    <!-- ribbed neck (static pivot behind the head) -->
    <g class="neck">
      <rect class="neckseg" x="102" y="252" width="36" height="9" rx="4"/>
      <rect class="neckseg" x="101" y="262" width="38" height="9" rx="4"/>
      <rect class="neckseg" x="100" y="272" width="40" height="9" rx="4"/>
      <rect class="neckseg" x="99"  y="282" width="42" height="14" rx="4"/>
    </g>

    <g id="headGroup">
      <!-- continuous skull (forehead to chin) -->
      <path class="skull" d="M120,34 C170,34 196,66 194,118
        C193,152 186,182 168,206 C158,226 150,250 120,258
        C90,250 82,226 72,206 C54,182 47,152 46,118 C44,66 70,34 120,34 Z"/>

      <!-- panel seams (faceted 3D-print look) -->
      <path class="seam" d="M120,36 L94,66 M120,36 L146,66 M94,66 L146,66
                            M74,86 L94,66 M166,86 L146,66 M74,86 L166,86"/>
      <path class="seam" d="M64,116 L84,150 M176,116 L156,150"/>

      <!-- ear-side actuators -->
      <g>
        <circle class="ear" cx="50" cy="132" r="15"/>
        <circle class="earline" cx="50" cy="132" r="9.5"/>
        <circle class="earline" cx="50" cy="132" r="4.5"/>
        <circle class="ear" cx="190" cy="132" r="15"/>
        <circle class="earline" cx="190" cy="132" r="9.5"/>
        <circle class="earline" cx="190" cy="132" r="4.5"/>
      </g>

      <!-- brow ridges -->
      <path class="brow" d="M78,107 Q96,101 116,107 Q98,105 78,107 Z"/>
      <path class="brow" d="M162,107 Q144,101 124,107 Q142,105 162,107 Z"/>

      <!-- eyes: iris moves with eye_x/eye_y (clipped to the eye); lid drops to blink -->
      <g clip-path="url(#clipL)">
        <ellipse class="sclera" cx="96" cy="120" rx="17" ry="11"/>
        <g class="iris" id="irisL">
          <circle class="irisball" cx="96" cy="120" r="8"/>
          <circle class="pupil"    cx="96" cy="120" r="3.4"/>
          <circle class="glint"    cx="93" cy="117" r="1.6"/>
        </g>
        <ellipse class="lid" cx="96" cy="120" rx="18.5" ry="12.5"/>
      </g>
      <g clip-path="url(#clipR)">
        <ellipse class="sclera" cx="144" cy="120" rx="17" ry="11"/>
        <g class="iris" id="irisR">
          <circle class="irisball" cx="144" cy="120" r="8"/>
          <circle class="pupil"    cx="144" cy="120" r="3.4"/>
          <circle class="glint"    cx="141" cy="117" r="1.6"/>
        </g>
        <ellipse class="lid" cx="144" cy="120" rx="18.5" ry="12.5"/>
      </g>

      <!-- nose -->
      <path class="nose" d="M120,124 C116,144 111,160 107,171
        C103,178 112,182 120,182 C128,182 137,178 133,171
        C129,160 124,144 120,124 Z"/>
      <ellipse class="nostril" cx="112" cy="177" rx="3.2" ry="2"/>
      <ellipse class="nostril" cx="128" cy="177" rx="3.2" ry="2"/>

      <!-- mouth: cavity grows and lower lip drops with the jaw servo -->
      <ellipse id="mouthCav" fill="url(#cav)" cx="120" cy="194" rx="26" ry="2"/>
      <path class="lip" d="M99,192 C110,196 130,196 141,192"/>
      <path class="lip" id="lowerlip" d="M104,198 C114,201 126,201 136,198"/>

      <!-- screw-hole detail dots -->
      <circle class="screw" cx="150" cy="92" r="1.5"/>
      <circle class="screw" cx="90"  cy="92" r="1.5"/>
      <circle class="screw" cx="120" cy="70" r="1.5"/>
      <circle class="screw" cx="68"  cy="150" r="1.5"/>
      <circle class="screw" cx="172" cy="150" r="1.5"/>
    </g>
  </svg>
</div>

<div id="servos"></div>
<div id="toast"></div>

<script>
let STATE = null;
let CALIB = false;
const throttle = {};   // per-servo trailing throttle timers

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET' };
  if (body) { opt.headers = {'Content-Type':'application/json'}; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function load() {
  STATE = await api('/api/state');
  const m = document.getElementById('mode');
  m.textContent = STATE.mock ? 'MOCK' : 'LIVE';
  m.className = 'badge ' + (STATE.mock ? 'mock' : 'live');
  render();
}

function render() {
  const wrap = document.getElementById('servos');
  wrap.innerHTML = '';
  for (const [name, s] of Object.entries(STATE.servos)) {
    const lo = CALIB ? 0 : s.min_angle;
    const hi = CALIB ? s.actuation_range : s.max_angle;
    const cur = s.current ?? s.rest_angle;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="row">
        <span class="name">${name} <span class="ch">ch ${s.channel}</span></span>
        <span class="val" id="v-${name}">${(+cur).toFixed(0)}°</span>
      </div>
      <div class="desc">${s.description || ''}</div>
      <input type="range" id="r-${name}" min="${lo}" max="${hi}" step="1" value="${cur}"
             oninput="move('${name}', this.value)">
      <div class="lim ${CALIB ? '' : 'hidden'}">
        <button onclick="record('${name}','min')">Set min</button>
        <button onclick="record('${name}','rest')">Set rest</button>
        <button onclick="record('${name}','max')">Set max</button>
        <span class="info" id="lim-${name}">min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}</span>
      </div>`;
    wrap.appendChild(el);
  }
  updateHead();
}

// ---- live head preview -------------------------------------------------
function _val(name) {
  const s = STATE.servos[name];
  if (!s) return null;
  const el = document.getElementById('r-' + name);
  return { v: el ? +el.value : (s.current ?? s.rest_angle), s };
}
function _centered(name) {           // -1..+1 around the servo's mid-travel
  const r = _val(name);
  if (!r) return 0;
  const mid = (r.s.min_angle + r.s.max_angle) / 2;
  const half = ((r.s.max_angle - r.s.min_angle) / 2) || 1;
  return Math.max(-1, Math.min(1, (r.v - mid) / half));
}
function updateHead() {
  if (!STATE) return;
  const g = document.getElementById('headGroup');
  if (g && STATE.servos.neck)
    g.style.transform = `perspective(640px) rotateY(${_centered('neck') * 32}deg)`;
  const ex = STATE.servos.eye_x ? _centered('eye_x') * 8 : 0;    // right = +
  const ey = STATE.servos.eye_y ? -_centered('eye_y') * 4 : 0;   // up = -
  for (const id of ['irisL', 'irisR']) {
    const p = document.getElementById(id);
    if (p) p.style.transform = `translate(${ex}px, ${ey}px)`;
  }
  const j = _val('jaw');
  const cav = document.getElementById('mouthCav'), low = document.getElementById('lowerlip');
  if (j && cav) {
    const f = Math.max(0, Math.min(1,
      (j.v - j.s.min_angle) / ((j.s.max_angle - j.s.min_angle) || 1)));
    const ry = 2 + f * 13;
    cav.setAttribute('ry', ry);
    cav.setAttribute('cy', 192 + ry);          // keep the upper lip fixed at ~192
    if (low) low.style.transform = `translateY(${f * 15}px)`;
  }
}

// occasional blink so the head reads as alive (skipped for reduced-motion)
function blink() {
  const h = document.getElementById('head');
  if (!h) return;
  h.classList.add('blinking');
  setTimeout(() => h.classList.remove('blinking'), 120);
}
function scheduleBlink() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setTimeout(() => { blink(); scheduleBlink(); }, 2600 + Math.random() * 3600);
}

function move(name, angle) {
  document.getElementById('v-' + name).textContent = (+angle).toFixed(0) + '°';
  updateHead();
  // trailing throttle: at most ~1 request / 60ms per servo, always send the last
  const t = throttle[name] || (throttle[name] = {});
  const now = performance.now();
  t.pending = angle;
  const send = () => { t.last = performance.now(); t.timer = null;
                       api('/api/move', {name, angle:+t.pending, raw:CALIB}); };
  if (!t.last || now - t.last > 60) send();
  else if (!t.timer) t.timer = setTimeout(send, 60);
}

async function record(name, field) {
  const angle = +document.getElementById('r-' + name).value;
  STATE = await api('/api/record', {name, field, angle});
  const s = STATE.servos[name];
  document.getElementById('lim-' + name).textContent =
    `min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}`;
  toast(`${name} ${field} = ${angle}°`);
}

async function save() { const r = await api('/api/save', {}); toast('Saved config'); }

async function rest() { STATE = await api('/api/rest'); render(); }
async function relax() { await api('/api/relax', {}); toast('Relaxed'); }

function setCalib() {
  CALIB = document.getElementById('calib').checked;
  document.getElementById('saveBtn').classList.toggle('hidden', !CALIB);
  render();
}

load();
scheduleBlink();
</script>
</body>
</html>
