<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>InMoov Control</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --line:#252c38; --fg:#e6edf3;
          --mut:#8b98a9; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--fg); padding:16px; max-width:820px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; letter-spacing:.04em; }
  .badge.mock { background:#3a2a00; color:var(--warn); }
  .badge.live { background:#04310f; color:var(--ok); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  button { font:inherit; font-weight:600; color:var(--fg); background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:10px 16px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--mut); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .name { font-weight:700; font-size:17px; }
  .ch { color:var(--mut); font-size:13px; font-weight:500; }
  .desc { color:var(--mut); font-size:13px; margin:2px 0 10px; }
  .val { font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; }
  input[type=range] { width:100%; height:38px; accent-color:var(--accent); }
  .lim { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .lim.hidden { display:none; }
  .lim button { padding:8px 12px; font-size:13px; }
  .lim .info { color:var(--mut); font-size:12px; align-self:center; margin-left:auto;
               font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#04310f; color:var(--ok); border:1px solid #0a5; padding:10px 18px;
           border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; font-weight:600; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>InMoov Control</h1>
  <span id="mode" class="badge">…</span>
</header>

<div class="bar">
  <button onclick="rest()">↺ Rest all</button>
  <button onclick="relax()">◌ Relax all</button>
  <button id="saveBtn" class="primary hidden" onclick="save()">💾 Save config</button>
  <label class="toggle"><input type="checkbox" id="calib" onchange="setCalib()"> Calibration mode</label>
</div>

<div id="servos"></div>
<div id="toast"></div>

<script>
let STATE = null;
let CALIB = false;
const throttle = {};   // per-servo trailing throttle timers

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET' };
  if (body) { opt.headers = {'Content-Type':'application/json'}; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function load() {
  STATE = await api('/api/state');
  const m = document.getElementById('mode');
  m.textContent = STATE.mock ? 'MOCK' : 'LIVE';
  m.className = 'badge ' + (STATE.mock ? 'mock' : 'live');
  render();
}

function render() {
  const wrap = document.getElementById('servos');
  wrap.innerHTML = '';
  for (const [name, s] of Object.entries(STATE.servos)) {
    const lo = CALIB ? 0 : s.min_angle;
    const hi = CALIB ? s.actuation_range : s.max_angle;
    const cur = s.current ?? s.rest_angle;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="row">
        <span class="name">${name} <span class="ch">ch ${s.channel}</span></span>
        <span class="val" id="v-${name}">${(+cur).toFixed(0)}°</span>
      </div>
      <div class="desc">${s.description || ''}</div>
      <input type="range" id="r-${name}" min="${lo}" max="${hi}" step="1" value="${cur}"
             oninput="move('${name}', this.value)">
      <div class="lim ${CALIB ? '' : 'hidden'}">
        <button onclick="record('${name}','min')">Set min</button>
        <button onclick="record('${name}','rest')">Set rest</button>
        <button onclick="record('${name}','max')">Set max</button>
        <span class="info" id="lim-${name}">min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}</span>
      </div>`;
    wrap.appendChild(el);
  }
}

function move(name, angle) {
  document.getElementById('v-' + name).textContent = (+angle).toFixed(0) + '°';
  // trailing throttle: at most ~1 request / 60ms per servo, always send the last
  const t = throttle[name] || (throttle[name] = {});
  const now = performance.now();
  t.pending = angle;
  const send = () => { t.last = performance.now(); t.timer = null;
                       api('/api/move', {name, angle:+t.pending, raw:CALIB}); };
  if (!t.last || now - t.last > 60) send();
  else if (!t.timer) t.timer = setTimeout(send, 60);
}

async function record(name, field) {
  const angle = +document.getElementById('r-' + name).value;
  STATE = await api('/api/record', {name, field, angle});
  const s = STATE.servos[name];
  document.getElementById('lim-' + name).textContent =
    `min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}`;
  toast(`${name} ${field} = ${angle}°`);
}

async function save() { const r = await api('/api/save', {}); toast('Saved config'); }

async function rest() { STATE = await api('/api/rest'); render(); }
async function relax() { await api('/api/relax', {}); toast('Relaxed'); }

function setCalib() {
  CALIB = document.getElementById('calib').checked;
  document.getElementById('saveBtn').classList.toggle('hidden', !CALIB);
  render();
}

load();
</script>
</body>
</html>
