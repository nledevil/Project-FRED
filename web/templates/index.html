<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>InMoov Control</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --line:#252c38; --fg:#e6edf3;
          --mut:#8b98a9; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--fg); padding:16px; max-width:820px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; letter-spacing:.04em; }
  .badge.mock { background:#3a2a00; color:var(--warn); }
  .badge.live { background:#04310f; color:var(--ok); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  button { font:inherit; font-weight:600; color:var(--fg); background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:10px 16px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--mut); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .name { font-weight:700; font-size:17px; }
  .ch { color:var(--mut); font-size:13px; font-weight:500; }
  .desc { color:var(--mut); font-size:13px; margin:2px 0 10px; }
  .val { font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; }
  input[type=range] { width:100%; height:38px; accent-color:var(--accent); }
  .lim { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .lim.hidden { display:none; }
  .lim button { padding:8px 12px; font-size:13px; }
  .lim .info { color:var(--mut); font-size:12px; align-self:center; margin-left:auto;
               font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#04310f; color:var(--ok); border:1px solid #0a5; padding:10px 18px;
           border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; font-weight:600; }
  #toast.show { opacity:1; }
  .stage { display:flex; justify-content:center; margin:6px 0 22px;
           filter:drop-shadow(0 10px 22px #0009); }
  .stage svg { width:min(60vw,240px); height:auto; }
  #headGroup { transform-box:fill-box; transform-origin:50% 46%; transition:transform .12s ease; }
  .skull, .nose { fill:url(#skull); stroke:#b3bcc7; stroke-width:1; }
  .seam { fill:none; stroke:#98a2ae; stroke-width:.8; opacity:.5;
          stroke-linecap:round; stroke-linejoin:round; }
  .socket { fill:#0a0d12; }
  .iris { transition:transform .07s linear; }
  .irisball { fill:url(#iris); }
  .iring { fill:none; stroke:#a9c2ff; stroke-width:1; opacity:.75; }
  .gloss { fill:#eaf2ff; opacity:.7; }
  .pupil { fill:#04060c; }
  .lidshadow { fill:none; stroke:#00000038; stroke-width:4; stroke-linecap:round; }
  .rim { fill:none; stroke:#c2cad4; stroke-width:2; }
  .lash { fill:none; stroke:#6f7a87; stroke-width:1.6; opacity:.6; stroke-linecap:round; }
  .vent { fill:#20262e; opacity:.9; }
  .nostril { fill:#20272f; opacity:.85; }
  .lip { fill:none; stroke:#8f99a6; stroke-width:1.5; opacity:.7; stroke-linecap:round; }
  #lowerlip { transition:transform .1s ease; }
  .rod { stroke:#0f1319; stroke-width:9; stroke-linecap:round; fill:none; }
  .neckcore { fill:#14181f; stroke:#242c37; stroke-width:1; }
  .rib { stroke:#2a323d; stroke-width:1; fill:none; }
  .screw { fill:#3a4149; opacity:.8; }
  @media (prefers-reduced-motion: reduce) {
    #headGroup, .iris, #lowerlip { transition:none; }
  }
</style>
</head>
<body>
<header>
  <h1>InMoov Control</h1>
  <span id="mode" class="badge">…</span>
</header>

<div class="bar">
  <button onclick="rest()">↺ Rest all</button>
  <button onclick="relax()">◌ Relax all</button>
  <button id="saveBtn" class="primary hidden" onclick="save()">💾 Save config</button>
  <label class="toggle"><input type="checkbox" id="calib" onchange="setCalib()"> Calibration mode</label>
</div>

<div class="stage">
  <svg id="head" viewBox="0 0 240 300" aria-label="InMoov head preview">
    <defs>
      <linearGradient id="skull" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fdfdfe"/>
        <stop offset="0.55" stop-color="#e7ecf1"/>
        <stop offset="1" stop-color="#c7ced8"/>
      </linearGradient>
      <radialGradient id="iris" cx="0.5" cy="0.45" r="0.55">
        <stop offset="0" stop-color="#3f6ff0"/>
        <stop offset="0.55" stop-color="#1e46c2"/>
        <stop offset="1" stop-color="#12308f"/>
      </radialGradient>
      <linearGradient id="cav" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04060a"/>
        <stop offset="1" stop-color="#141f2b"/>
      </linearGradient>
      <clipPath id="clipL"><path d="M63,122 Q84,110.5 105,122 Q84,133.5 63,122 Z"/></clipPath>
      <clipPath id="clipR"><path d="M135,122 Q156,110.5 177,122 Q156,133.5 135,122 Z"/></clipPath>
    </defs>

    <!-- mechanical neck (static pivot behind the head) -->
    <path class="rod" d="M98,300 L112,254"/>
    <path class="rod" d="M142,300 L128,254"/>
    <rect class="neckcore" x="106" y="252" width="28" height="48" rx="8"/>
    <path class="rib" d="M107,264 H133 M107,274 H133 M107,284 H133"/>

    <g id="headGroup">
      <!-- skull -->
      <path class="skull" d="M120,32 C174,32 200,66 198,116
        C197,150 192,180 176,206 C166,226 150,250 120,258
        C90,250 74,226 64,206 C48,180 43,150 42,116 C40,66 66,32 120,32 Z"/>

      <!-- faceted cap: five seams radiate from a point, plus the cap seam -->
      <path class="seam" d="M46,108 Q120,102 194,108"/>
      <path class="seam" d="M120,40 L120,86 M62,54 L120,86 M178,54 L120,86 M120,86 L70,106 M120,86 L170,106"/>
      <!-- cheek / jaw panel seams -->
      <path class="seam" d="M60,138 Q55,182 76,214 M180,138 Q185,182 164,214"/>
      <path class="seam" d="M80,205 Q120,212 160,205"/>

      <!-- eyes: eyeball clipped to the almond opening; rim = the sculpted eyelid -->
      <g clip-path="url(#clipL)">
        <path class="socket" d="M63,122 Q84,110.5 105,122 Q84,133.5 63,122 Z"/>
        <g class="iris" id="irisL">
          <circle class="irisball" cx="84" cy="122" r="9"/>
          <circle class="iring"    cx="84" cy="122" r="8.4"/>
          <circle class="pupil"    cx="84" cy="122" r="5"/>
          <ellipse class="gloss"   cx="81.5" cy="118.5" rx="2.4" ry="1.4"/>
        </g>
        <path class="lidshadow" d="M63,122 Q84,110.5 105,122"/>
      </g>
      <path class="rim"  d="M63,122 Q84,110.5 105,122 Q84,133.5 63,122 Z"/>
      <path class="lash" d="M63,122 Q84,110.5 105,122"/>
      <g clip-path="url(#clipR)">
        <path class="socket" d="M135,122 Q156,110.5 177,122 Q156,133.5 135,122 Z"/>
        <g class="iris" id="irisR">
          <circle class="irisball" cx="156" cy="122" r="9"/>
          <circle class="iring"    cx="156" cy="122" r="8.4"/>
          <circle class="pupil"    cx="156" cy="122" r="5"/>
          <ellipse class="gloss"   cx="153.5" cy="118.5" rx="2.4" ry="1.4"/>
        </g>
        <path class="lidshadow" d="M135,122 Q156,110.5 177,122"/>
      </g>
      <path class="rim"  d="M135,122 Q156,110.5 177,122 Q156,133.5 135,122 Z"/>
      <path class="lash" d="M135,122 Q156,110.5 177,122"/>

      <!-- nose -->
      <path class="nose" d="M120,120 C116,140 112,156 107,168
        C102,176 111,182 120,182 C129,182 138,176 133,168
        C128,156 124,140 120,120 Z"/>
      <ellipse class="nostril" cx="111" cy="177" rx="3" ry="1.7"/>
      <ellipse class="nostril" cx="129" cy="177" rx="3" ry="1.7"/>
      <path class="vent" d="M107,183 L111,183 L109,187 Z"/>
      <path class="vent" d="M133,183 L129,183 L131,187 Z"/>
      <path class="seam" d="M108,178 Q102,190 100,198 M132,178 Q138,190 140,198"/>

      <!-- mouth: cavity grows + lower lip drops with the jaw servo -->
      <ellipse id="mouthCav" fill="url(#cav)" cx="120" cy="200" rx="23" ry="2"/>
      <path class="lip" d="M100,198 Q120,200 140,198"/>
      <path class="lip" id="lowerlip" d="M103,203 Q120,209 137,203"/>

      <!-- screw-hole detail dots -->
      <circle class="screw" cx="80"  cy="78"  r="1.7"/>
      <circle class="screw" cx="160" cy="78"  r="1.7"/>
      <circle class="screw" cx="58"  cy="118" r="1.6"/>
      <circle class="screw" cx="182" cy="118" r="1.6"/>
      <circle class="screw" cx="72"  cy="168" r="1.6"/>
      <circle class="screw" cx="168" cy="168" r="1.6"/>
      <circle class="screw" cx="86"  cy="214" r="1.6"/>
      <circle class="screw" cx="154" cy="214" r="1.6"/>
    </g>
  </svg>
</div>

<div id="servos"></div>
<div id="toast"></div>

<script>
let STATE = null;
let CALIB = false;
const throttle = {};   // per-servo trailing throttle timers

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET' };
  if (body) { opt.headers = {'Content-Type':'application/json'}; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function load() {
  STATE = await api('/api/state');
  const m = document.getElementById('mode');
  m.textContent = STATE.mock ? 'MOCK' : 'LIVE';
  m.className = 'badge ' + (STATE.mock ? 'mock' : 'live');
  render();
}

function render() {
  const wrap = document.getElementById('servos');
  wrap.innerHTML = '';
  for (const [name, s] of Object.entries(STATE.servos)) {
    const lo = CALIB ? 0 : s.min_angle;
    const hi = CALIB ? s.actuation_range : s.max_angle;
    const cur = s.current ?? s.rest_angle;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="row">
        <span class="name">${name} <span class="ch">ch ${s.channel}</span></span>
        <span class="val" id="v-${name}">${(+cur).toFixed(0)}°</span>
      </div>
      <div class="desc">${s.description || ''}</div>
      <input type="range" id="r-${name}" min="${lo}" max="${hi}" step="1" value="${cur}"
             oninput="move('${name}', this.value)">
      <div class="lim ${CALIB ? '' : 'hidden'}">
        <button onclick="record('${name}','min')">Set min</button>
        <button onclick="record('${name}','rest')">Set rest</button>
        <button onclick="record('${name}','max')">Set max</button>
        <span class="info" id="lim-${name}">min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}</span>
      </div>`;
    wrap.appendChild(el);
  }
  updateHead();
}

// ---- live head preview -------------------------------------------------
function _val(name) {
  const s = STATE.servos[name];
  if (!s) return null;
  const el = document.getElementById('r-' + name);
  return { v: el ? +el.value : (s.current ?? s.rest_angle), s };
}
function _centered(name) {           // -1..+1 around the servo's mid-travel
  const r = _val(name);
  if (!r) return 0;
  const mid = (r.s.min_angle + r.s.max_angle) / 2;
  const half = ((r.s.max_angle - r.s.min_angle) / 2) || 1;
  return Math.max(-1, Math.min(1, (r.v - mid) / half));
}
function updateHead() {
  if (!STATE) return;
  const g = document.getElementById('headGroup');
  if (g && STATE.servos.neck)
    g.style.transform = `perspective(640px) rotateY(${_centered('neck') * 32}deg)`;
  const ex = STATE.servos.eye_x ? _centered('eye_x') * 8 : 0;     // right = +
  const ey = STATE.servos.eye_y ? -_centered('eye_y') * 2.5 : 0;  // up = -
  for (const id of ['irisL', 'irisR']) {
    const p = document.getElementById(id);
    if (p) p.style.transform = `translate(${ex}px, ${ey}px)`;
  }
  const j = _val('jaw');
  const cav = document.getElementById('mouthCav'), low = document.getElementById('lowerlip');
  if (j && cav) {
    const f = Math.max(0, Math.min(1,
      (j.v - j.s.min_angle) / ((j.s.max_angle - j.s.min_angle) || 1)));
    const ry = 2 + f * 11;
    cav.setAttribute('ry', ry);
    cav.setAttribute('cy', 198 + ry);          // keep the upper lip fixed at ~198
    if (low) low.style.transform = `translateY(${f * 13}px)`;
  }
}

function move(name, angle) {
  document.getElementById('v-' + name).textContent = (+angle).toFixed(0) + '°';
  updateHead();
  // trailing throttle: at most ~1 request / 60ms per servo, always send the last
  const t = throttle[name] || (throttle[name] = {});
  const now = performance.now();
  t.pending = angle;
  const send = () => { t.last = performance.now(); t.timer = null;
                       api('/api/move', {name, angle:+t.pending, raw:CALIB}); };
  if (!t.last || now - t.last > 60) send();
  else if (!t.timer) t.timer = setTimeout(send, 60);
}

async function record(name, field) {
  const angle = +document.getElementById('r-' + name).value;
  STATE = await api('/api/record', {name, field, angle});
  const s = STATE.servos[name];
  document.getElementById('lim-' + name).textContent =
    `min ${s.min_angle} · rest ${s.rest_angle} · max ${s.max_angle}`;
  toast(`${name} ${field} = ${angle}°`);
}

async function save() { await api('/api/save', {}); toast('Saved config'); }

async function rest() { STATE = await api('/api/rest'); render(); }
async function relax() { await api('/api/relax', {}); toast('Relaxed'); }

function setCalib() {
  CALIB = document.getElementById('calib').checked;
  document.getElementById('saveBtn').classList.toggle('hidden', !CALIB);
  render();
}

load();
</script>
</body>
</html>
