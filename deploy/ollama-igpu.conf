# Use the Intel Arc iGPU (Vulkan backend, which this Ollama build ships).
# Integrated GPUs are opt-in: without this, Ollama reports "no GPU" and runs
# CPU-only, which on a 4B model is ~12 tok/s — too slow for a talking head.
[Service]
Environment="OLLAMA_IGPU_ENABLE=1"

# ...and wait for the GPU to actually exist before Ollama goes looking for it.
# Ollama probes for devices exactly once, at startup, and keeps that answer for
# the life of the process. On a cold boot it lost a race it gave no sign of
# losing: the xe driver was still loading GuC/HuC firmware at 00:48:33 while
# Ollama started at :31 and probed at :32. It found nothing, logged one line,
# and ran the whole uptime on the CPU — which is what made FRED take 28 seconds
# to answer a question. Nothing was misconfigured; it just booted too early.
#
# vulkaninfo (vulkan-tools) is the honest test: the /dev/dri render node appears
# well before the GPU can be used, so waiting on the node would not have helped.
# Match _GPU so the llvmpipe software device — which reports PHYSICAL_DEVICE_-
# TYPE_CPU and is always present — doesn't satisfy the wait.
#
# Gives up after 60s rather than blocking boot: a machine with no usable GPU
# must still start Ollama, just on the CPU.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do vulkaninfo --summary 2>/dev/null | grep -q "deviceType.*_GPU" && exit 0; sleep 1; done; echo "no Vulkan GPU after 60s - starting on CPU" >&2; exit 0'
