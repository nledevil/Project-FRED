# Drop-in for pi-bluetooth's bthelper@.service on the chest Pi.
#
# DietPi attaches the on-board Bluetooth via device tree (the kernel logs
# "hci_uart_bcm serial0-0"), so hciuart/btuart is neither present nor needed --
# but upstream bthelper@.service hard-Requires hciuart.service, which can never
# start here because it is WantedBy=dev-serial1.device and DietPi has no
# /dev/serial1. Drop that dependency; all we want from bthelper is the BDADDR
# check and the post-init reinit that enables Secure Simple Pairing.
[Unit]
Requires=
After=
Requires=bluetooth.service
Before=bluetooth.service
