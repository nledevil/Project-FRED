# InMoov WiFi fallback access point (hostapd).
# Used by inmoov-autohotspot when no known network is in range.
# Installed to: /etc/hostapd/inmoov-hostapd.conf
#
# Change the SSID / password here, then re-run deploy/hotspot/install.sh
# (or copy this file to /etc/hostapd/inmoov-hostapd.conf) and reboot.

interface=wlan0
driver=nl80211

# --- what devices see and join ---
ssid=InMoov-FRED
wpa_passphrase=inmoov-robot

# --- radio: 2.4 GHz, channel 6 (widest device compatibility) ---
country_code=GB
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# --- security: WPA2-PSK (AES/CCMP) ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ignore_broadcast_ssid=0
