# DHCP + local DNS for the InMoov WiFi fallback access point.
# Launched by inmoov-autohotspot ONLY while the AP is up (never system-wide).
# Installed to: /etc/inmoov/hotspot-dnsmasq.conf
#
# The Pi is 192.168.50.1; joined devices get 192.168.50.10-100. There is no
# internet upstream in AP mode (that's the point) — this only serves the LAN so
# a phone/laptop can reach the control panel at http://192.168.50.1:8080

interface=wlan0
bind-dynamic
except-interface=lo

dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1

# No upstream resolver in AP mode; answer local names, ignore the rest.
no-resolv
domain-needed
bogus-priv
address=/inmoov.local/192.168.50.1
address=/fred.local/192.168.50.1
