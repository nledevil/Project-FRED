# FRED robot LAN — DHCP + DNS for the Pis on the switch behind enp87s0.
#
# The NUC is the brain and owns 10.0.0.1. Nothing else on this segment runs a
# DHCP server, so without this the Pis fall back to 169.254 link-local and are
# effectively unreachable.
#
# bind-interfaces + interface= keeps dnsmasq on 10.0.0.1 only. systemd-resolved
# already holds 127.0.0.53/127.0.0.54:53, so binding the wildcard would collide;
# this way the two coexist and the house WiFi side is left alone.
interface=br0
bind-interfaces
except-interface=lo
no-dhcp-interface=wlo1

domain=fred.lan
local=/fred.lan/
expand-hosts

# Reservations keyed on each Pi's eth0 MAC, so the head and chest always land on
# the same address no matter what order they boot in. Anything else that gets
# plugged into the switch takes a lease from the pool.
dhcp-range=10.0.0.100,10.0.0.199,12h
dhcp-host=e4:5f:01:49:60:b9,head,10.0.0.10,24h
dhcp-host=dc:a6:32:c8:f6:15,chest,10.0.0.11,24h

# Deliberately NO option:router here. The Pis keep their own WiFi for internet
# and management; this segment is a dedicated robot link, and handing out a
# second default route would race the one they already have on wlan0.
# If the Pis ever drop WiFi, uncomment this and start fred-nat.service:
#dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1
# The brain is the robot LAN's time source too (chrony, see
# /etc/chrony/conf.d/robot-lan.conf). Advertising it here means anything joining
# this segment gets correct time without being configured for it — which matters
# because devices down here have no route to the internet and no RTC, so an
# unreachable public pool leaves them silently drifting. The chest Pi sat 29
# minutes behind for exactly that reason.
dhcp-option=option:ntp-server,10.0.0.1
server=1.1.1.1
server=8.8.8.8

log-dhcp
