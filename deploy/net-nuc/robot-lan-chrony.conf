# Serve time to the robot LAN.
#
# The chest Pi has no route to the internet — its default route is this machine,
# and DNS from there fails — so the brain is its only possible time source. It
# had drifted 29 minutes by 2026-08-09 because DietPi's boot sync was aimed at a
# public pool it cannot reach.
allow 10.0.0.0/24

# Keep serving when the venue has no internet. Without this, chrony refuses to
# act as a source once its own upstreams are unreachable, and the robot's three
# clocks would drift apart exactly when there is no way to fix them. Stratum 10
# is low enough that a real upstream always wins if one is available.
local stratum 10
