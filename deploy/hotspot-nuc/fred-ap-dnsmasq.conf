# DHCP/DNS for the "fred" access point only.
#
# A SEPARATE dnsmasq instance from the one serving the robot LAN, deliberately.
# That one hands the head and chest Pis their addresses on br0 and is therefore
# load-bearing: if it fails, the robot's own network fails. Turning a hotspot on
# and off must not be able to do that, so the AP gets its own process, its own
# config and its own lease file, and the two cannot interfere.
interface=wlo1
bind-interfaces
listen-address=192.168.50.1
dhcp-range=192.168.50.50,192.168.50.150,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
dhcp-leasefile=/var/lib/misc/fred-ap.leases
pid-file=/run/fred-ap-dnsmasq.pid
# Resolve for guests, using whatever this machine resolves with.
#
# This used to be `no-resolv` -- joining the AP reached the robot and nothing
# else. It now routes to the internet (see fred-nat.nft), and a client with a
# route but no resolver is worse than one with neither: the browser hangs
# instead of failing, and a phone decides the network is broken.
#
# The systemd-resolved file rather than a hardcoded server, so this follows the
# uplink. Whatever the USB card's network hands out is what guests get, and at a
# venue that is the venue's resolver, which is the one that will actually answer
# there. If the uplink is down the queries fail, which is honest -- the AP still
# serves the panel at 192.168.50.1 either way.
resolv-file=/run/systemd/resolve/resolv.conf
