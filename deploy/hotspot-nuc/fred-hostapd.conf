# Access point "fred", hosted on the NUC's onboard Intel radio.
#
# It is on wlo1 and not the USB card for a hardware reason: the Realtek
# RTL8188EUS's in-kernel driver (rtl8xxxu) advertises "managed" and "monitor"
# only -- it cannot be an AP at all. The Intel advertises AP, so the two cards
# swapped jobs: the USB one is now the house-WiFi client (all a client needs is
# managed) and the Intel is free to serve this.
interface=wlo1
driver=nl80211

ssid=fred
hw_mode=g
channel=6
country_code=US
ieee80211n=1
wmm_enabled=1

# WPA2-PSK. Open would be simpler and is not worth it: this network reaches the
# panel, which can move a 350 lb drive base.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=inmoov-robot

# Visible: the point is joining it from a phone at a venue with no other WiFi.
ignore_broadcast_ssid=0
