# Route for the "fred" access point's clients. Installed as
# /etc/sysctl.d/99-fred-nat.conf.
#
# Off by default on Ubuntu, and off on this machine until the AP was given a
# way out to the internet. On its own this would also let AP clients reach the
# robot LAN, which is exactly what we do not want -- the drop rule in
# fred-nat.nft is the other half of this change and is not optional.
net.ipv4.ip_forward=1

# ...and the v6 half, for Tailscale's subnet route onto the robot LAN. Tailscale
# warns about this at start-up and then works anyway over v4, which is the kind
# of half-working that gets diagnosed at a venue rather than at a desk.
net.ipv6.conf.all.forwarding=1
